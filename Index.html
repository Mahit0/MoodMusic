<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<!-- en tete humeur navigation -->
<div class="container">
    <header class="d-flex justify-content-center py-3">
      <ul class="nav nav-pills">
        <li class="nav-item"><a href="#" class="nav-link active" aria-current="page">🏠</a></li>
            <li id="happy" class="happy"><a href="#" class="nav-link">😊</a></li>
            <li id="chill" class="chill"><a href="#" class="nav-link">😎</a></li>
            <li id="sad" class="sad"><a href="#" class="nav-link">😭</a></li>
            <li id="energy" class="energy"><a href="#" class="nav-link">🥳</a></li>
            <li id="fun" class="fun"><a href="#" class="nav-link">🎯</a></li>
      </ul>
    </header>
  </div>
<body>

  <!-- Lecteur de musique -->
  <div class="music-player" id="player">

    <!-- Bouton favori en haut à droite -->
    <button class="btn-favorite" id="btnFavorite" aria-label="Ajouter aux favoris">
      <span class="heart-icon">🤍</span>
    </button>

    <!-- Pochette d'album -->
    <div class="album-cover">
      <img src="" alt="Pochette d'album" id="albumCover">
    </div>

    <!-- Nom de la musique au milieu -->
    <div class="track-info">
      <p class="track-title" id="trackTitle">Titre de la musique</p>
      <p class="track-artist" id="trackArtist">Artiste</p>
    </div>

    <!-- Contrôles de lecture -->
    <div class="controls">
      <button class="btn-control" id="btnPrev" aria-label="Précédent">⏮️</button>
      <button class="btn-control" id="btnPlay" aria-label="Lecture / Pause">▶️</button>
      <button class="btn-control" id="btnNext" aria-label="Suivant">⏭️</button>
    </div>

  </div>

  <!-- Liste des favoris -->
  <div class="favorites-zone" id="favoritesZone">
    <h2 class="favorites-title">Mes favoris</h2>
    <ul class="favorites-list" id="favoritesList">
      <!-- Les favoris seront ajoutés ici en JS -->
    </ul>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
